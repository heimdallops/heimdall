name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: When true, runs all checks but does not run npm publish
        type: boolean
        required: false
        default: false
      package_artifact_name:
        description: Uploaded npm tarball artifact name from the build workflow (must exist on this run).
        type: string
        required: true
  workflow_call:
    inputs:
      dry_run:
        description: When true, runs all checks but does not run npm publish
        type: boolean
        required: false
        default: false
      package_artifact_name:
        description: Uploaded npm tarball artifact from the build workflow.
        type: string
        required: true
    outputs:
      publish_status:
        description: success or failure
        value: ${{ jobs.publish.outputs.status }}
      publish_error_message:
        description: Error detail when publish_status is failure (may be empty)
        value: ${{ jobs.publish.outputs.error_message }}
      package_version:
        description: Package version read from the published tarball (when publish ran)
        value: ${{ jobs.publish.outputs.package_version }}
    secrets:
      NPM_TOKEN:
        required: true

concurrency:
  group: publish-npm-${{ inputs.package_artifact_name }}-${{ inputs.dry_run }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.summary.outputs.status }}
      error_message: ${{ steps.summary.outputs.error_message }}
      package_version: ${{ steps.pkg_from_tarball.outputs.version }}
    steps:
      - name: Download built package artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.package_artifact_name }}
          path: .

      - name: Extract Node version file from tarball
        run: |
          set -euo pipefail
          TGZ="$(printf '%s\n' ./*.tgz | head -1)"
          test -f "$TGZ"
          tar -xzf "$TGZ" package/package.json
          mv package/package.json node-version-hint.json
          rm -rf package

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: node-version-hint.json
          registry-url: https://registry.npmjs.org

      - name: Read package manifest from tarball
        id: pkg_from_tarball
        run: |
          set -euo pipefail
          TGZ="$(printf '%s\n' ./*.tgz | head -1)"
          test -f "$TGZ"
          PKG_JSON="$(tar -xOf "$TGZ" package/package.json)"
          {
            echo "name=$(printf '%s' "$PKG_JSON" | jq -r .name)"
            echo "version=$(printf '%s' "$PKG_JSON" | jq -r .version)"
          } >> "$GITHUB_OUTPUT"

      - name: Check if version is already published
        id: version_check
        run: |
          PKG_VERSION="${{ steps.pkg_from_tarball.outputs.version }}"
          PKG_NAME="${{ steps.pkg_from_tarball.outputs.name }}"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null | grep -q "${PKG_VERSION}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} is already published — skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} is new — will publish."
          fi

      - name: Publish package
        id: npm_publish
        if: steps.version_check.outputs.published == 'false'
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish ./*.tgz --access public --dry-run 2>&1 | tee "${RUNNER_TEMP}/npm-publish.log"
          else
            npm publish ./*.tgz --access public 2>&1 | tee "${RUNNER_TEMP}/npm-publish.log"
          fi

      - name: Summarize publish outcome
        id: summary
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.version_check.outputs.published }}" = "true" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "error_message=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PUB_OUTCOME="${{ steps.npm_publish.outcome }}"
          if [ "$PUB_OUTCOME" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "error_message=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=failure" >> "$GITHUB_OUTPUT"
          LOG="$(cat "${RUNNER_TEMP}/npm-publish.log" 2>/dev/null || echo "(no npm log captured)")"
          {
            echo "error_message<<EOF"
            printf '%s\n' "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce publish success
        if: always() && steps.summary.outputs.status == 'failure'
        run: |
          echo "::error::npm publish did not succeed"
          exit 1
