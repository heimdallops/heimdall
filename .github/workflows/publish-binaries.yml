name: Publish binaries

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout (branch, tag, or commit SHA)
        type: string
        required: true
      release_tag:
        description: GitHub release tag to upload binaries to
        type: string
        required: true
      dry_run:
        description: When true, prints what would be uploaded but does not upload
        type: boolean
        required: false
        default: false
    outputs:
      checksums_artifact_name:
        description: Resolved artifact name for the checksums.txt artifact
        value: ${{ jobs.publish.outputs.checksums_artifact_name }}

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build SEA binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            binary_name: heimdall-linux-x64
            archive_name: heimdall-linux-x64.tar.gz
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            binary_name: heimdall-linux-arm64
            archive_name: heimdall-linux-arm64.tar.gz
          - target: macos-x64
            runner: macos-13
            binary_name: heimdall-macos-x64
            archive_name: heimdall-macos-x64.tar.gz
          - target: macos-arm64
            runner: macos-latest
            binary_name: heimdall-macos-arm64
            archive_name: heimdall-macos-arm64.tar.gz
          - target: windows-x64
            runner: windows-latest
            binary_name: heimdall-windows-x64.exe
            archive_name: heimdall-windows-x64.zip

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SEA blob
        run: npm run build:sea

      - name: Copy node binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cp "$(which node)" "${{ matrix.binary_name }}"

      - name: Copy node binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath "${{ matrix.binary_name }}"

      - name: Remove signature (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --remove-signature "${{ matrix.binary_name }}"

      - name: Remove signature (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: signtool remove /s "${{ matrix.binary_name }}"

      - name: Inject blob into binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npx postject "${{ matrix.binary_name }}" NODE_SEA_BLOB dist/heimdall.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Inject blob into binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npx postject "${{ matrix.binary_name }}" NODE_SEA_BLOB dist/heimdall.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            --macho-segment-name NODE_SEA

      - name: Inject blob into binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npx postject "${{ matrix.binary_name }}" NODE_SEA_BLOB dist/heimdall.blob `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Codesign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --sign - "${{ matrix.binary_name }}"

      - name: Test binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./${{ matrix.binary_name }} --help

      - name: Test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\${{ matrix.binary_name }} --help

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mv "${{ matrix.binary_name }}" heimdall
          tar -czf "${{ matrix.archive_name }}" heimdall

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Rename-Item "${{ matrix.binary_name }}" heimdall.exe
          Compress-Archive -Path heimdall.exe -DestinationPath "${{ matrix.archive_name }}"

      - name: Upload SEA archive artifact
        uses: actions/upload-artifact@v5
        with:
          name: sea-binary-${{ matrix.target }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  publish:
    name: Publish binaries to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      checksums_artifact_name: ${{ steps.resolve-checksums-artifact-name.outputs.name }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Download Linux x64 archive
        uses: actions/download-artifact@v5
        with:
          name: sea-binary-linux-x64
          path: ./archives

      - name: Download Linux arm64 archive
        uses: actions/download-artifact@v5
        with:
          name: sea-binary-linux-arm64
          path: ./archives

      - name: Download macOS x64 archive
        uses: actions/download-artifact@v5
        with:
          name: sea-binary-macos-x64
          path: ./archives

      - name: Download macOS arm64 archive
        uses: actions/download-artifact@v5
        with:
          name: sea-binary-macos-arm64
          path: ./archives

      - name: Download Windows x64 archive
        uses: actions/download-artifact@v5
        with:
          name: sea-binary-windows-x64
          path: ./archives

      - name: Generate checksums.txt
        run: |
          cd archives
          sha256sum \
            heimdall-linux-x64.tar.gz \
            heimdall-linux-arm64.tar.gz \
            heimdall-macos-x64.tar.gz \
            heimdall-macos-arm64.tar.gz \
            heimdall-windows-x64.zip \
            > checksums.txt
          cat checksums.txt

      - name: Resolve checksums artifact name
        id: resolve-checksums-artifact-name
        run: echo "name=checksums-${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.resolve-checksums-artifact-name.outputs.name }}
          path: archives/checksums.txt
          if-no-files-found: error

      - name: Upload archives to GitHub release (dry run)
        if: inputs.dry_run
        run: |
          echo "DRY RUN: would upload these files to release ${{ inputs.release_tag }}:"
          find archives -type f | sort
          echo "scripts/install.sh"
          echo "---"
          cat archives/checksums.txt

      - name: Upload archives to GitHub release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            archives/heimdall-linux-x64.tar.gz \
            archives/heimdall-linux-arm64.tar.gz \
            archives/heimdall-macos-x64.tar.gz \
            archives/heimdall-macos-arm64.tar.gz \
            archives/heimdall-windows-x64.zip \
            archives/checksums.txt \
            scripts/install.sh \
            --clobber
