name: Reusable build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout (branch, tag, or commit SHA)
        type: string
        required: true
      upload_package_artifact:
        description: If true, package and upload an npm tarball artifact
        type: boolean
        required: false
        default: false
    outputs:
      package_artifact_name:
        description: Resolved artifact name including version and git hash
        value: ${{ jobs.build.outputs.package_artifact_name }}

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      package_artifact_name: ${{ steps.resolve-artifact-name.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: package.json
          cache: npm

      # Release flows check out a semver tag; sync package.json and package-lock.json to that tag
      # without ad-hoc edits or npm install (which can resolve and drift the lockfile).
      # --no-git-tag-version avoids commit/tag side effects in CI.
      - name: Sync package version from git
        run: npm version from-git --allow-same-version --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve package artifact name
        id: resolve-artifact-name
        run: |
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          TARGET_VERSION="$(jq -r '.version' package.json)"
          echo "name=npm-package-tarball-${TARGET_VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Pack npm tarball
        if: inputs.upload_package_artifact
        run: npm pack

      - name: Upload package artifact
        if: inputs.upload_package_artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.resolve-artifact-name.outputs.name }}
          path: "*.tgz"
