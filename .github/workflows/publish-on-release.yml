name: Publish to npm (release)

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: package.json

      - name: Validate tag is semver
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG="$(printf '%s' "${TAG_NAME:-}" | tr -d '[:space:]')"
          if [ -z "$TAG" ]; then
            echo "::error::release tag_name is empty"
            exit 1
          fi
          # Use the semver package CLI (not node -e require), so resolution works under act and npm exec.
          NORMALIZED="$(npm exec --yes --package=semver@7 -- semver "$TAG")" || {
            echo "::error::release tag must be valid semver (got ${TAG})"
            exit 1
          }
          echo "Release tag ok: ${NORMALIZED}"

  announce-discord:
    name: Announce release on Discord
    needs: validate-release-tag
    runs-on: ubuntu-latest
    steps:
      - name: Post release announcement to Discord
        continue-on-error: true
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: Heimdall CI
          embed-title: ${{ format('Release {0} published', github.event.release.tag_name) }}
          embed-description: |
            A new GitHub release is live. The npm package will be published in a few minutes.

            ${{ github.event.release.html_url }}
          embed-color: 3447003
          embed-footer-text: ${{ github.repository }}

  publish:
    needs: validate-release-tag
    uses: ./.github/workflows/publish-to-npm.yml
    with:
      ref: ${{ github.event.release.tag_name }}
      version: ${{ github.event.release.tag_name }}
    secrets: inherit
