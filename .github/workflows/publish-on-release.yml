name: Publish to npm (release)

on:
  release:
    types: [published]

permissions:
  contents: write
  actions: write

jobs:
  detect_dry_run:
    name: Detect dry run
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.flag.outputs.dry_run }}
    steps:
      - id: flag
        run: |
          if [ "${{ vars.DRY_RUN }}" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

  validate_release_tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Validate tag is semver
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG="$(printf '%s' "${TAG_NAME:-}" | tr -d '[:space:]')"
          if [ -z "$TAG" ]; then
            echo "::error::release tag_name is empty"
            exit 1
          fi
          NORMALIZED="$(npm exec --yes --package=semver@7 -- semver "$TAG")" || {
            echo "::error::release tag must be valid semver (got ${TAG})"
            exit 1
          }
          echo "Release tag ok: ${NORMALIZED}"

  prepare_release_branch:
    name: Sync package version and push release branch
    needs: validate_release_tag
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.release_branch.outputs.name }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: package.json

      - name: Create release branch and sync package version
        id: release_branch
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="${TAG_NAME#v}"
          BRANCH="release/${VERSION}"
          git checkout -b "$BRANCH"

          npm version from-git --no-git-tag-version --allow-same-version

          git add package.json package-lock.json
          git commit -m "chore: sync package version to ${VERSION}"
          git push origin "$BRANCH"

          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare_release_branch
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare_release_branch.outputs.branch_name }}
      upload_package_artifact: true

  publish_to_npm:
    name: Publish to npm
    needs:
      - detect_dry_run
      - prepare_release_branch
      - build
    if: needs.build.result == 'success'
    uses: ./.github/workflows/publish-to-npm.yml
    with:
      dry_run: ${{ needs.detect_dry_run.outputs.dry_run == 'true' }}
      package_artifact_name: ${{ needs.build.outputs.package_artifact_name }}
      package_name: ${{ needs.build.outputs.package_name }}
      package_version: ${{ needs.build.outputs.package_version }}
    secrets: inherit

  cleanup_release_branch:
    name: Delete release branch
    needs:
      - prepare_release_branch
      - publish_to_npm
    if: always() && needs.prepare_release_branch.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Delete remote release branch
        continue-on-error: true
        env:
          BRANCH_NAME: ${{ needs.prepare_release_branch.outputs.branch_name }}
        run: |
          set -euo pipefail
          if git ls-remote origin "refs/heads/${BRANCH_NAME}" | grep -q .; then
            git push origin --delete "${BRANCH_NAME}"
            echo "Deleted branch ${BRANCH_NAME}"
          else
            echo "::notice::Branch ${BRANCH_NAME} is not present on origin; skipping delete."
          fi

  notify_release_outcome:
    name: Notify release outcome (Discord)
    needs:
      - validate_release_tag
      - prepare_release_branch
      - build
      - publish_to_npm
      - cleanup_release_branch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Truncate publish error for Discord
        id: publish_err_excerpt
        env:
          FULL_MESSAGE: ${{ needs.publish_to_npm.outputs.publish_error_message }}
        run: |
          set -euo pipefail
          TEXT="$(printf '%s' "${FULL_MESSAGE:-}" | head -c 1200)"
          {
            echo "text<<EOF"
            printf '%s\n' "$TEXT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Discord embed metadata
        id: discord_meta
        env:
          VALIDATE: ${{ needs.validate_release_tag.result }}
          PREPARE: ${{ needs.prepare_release_branch.result }}
          BUILD: ${{ needs.build.result }}
          CLEANUP: ${{ needs.cleanup_release_branch.result }}
          PUBLISH_JOB: ${{ needs.publish_to_npm.result }}
        run: |
          set -euo pipefail
          FAILED=false
          [ "$VALIDATE" = "success" ] || FAILED=true
          [ "$PREPARE" = "success" ] || FAILED=true
          [ "$BUILD" = "success" ] || FAILED=true
          [ "$CLEANUP" = "success" ] || FAILED=true

          if [ "$BUILD" = "success" ]; then
            [ "$PUBLISH_JOB" = "success" ] || FAILED=true
          fi

          if [ "$FAILED" = true ]; then
            echo "color=15158332" >> "$GITHUB_OUTPUT"
            echo "title_prefix=Release pipeline failed" >> "$GITHUB_OUTPUT"
          else
            echo "color=3066993" >> "$GITHUB_OUTPUT"
            echo "title_prefix=Release pipeline succeeded" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose Discord embed description
        id: discord_embed
        env:
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          R_VALIDATE: ${{ needs.validate_release_tag.result }}
          R_PREPARE: ${{ needs.prepare_release_branch.result }}
          R_BUILD: ${{ needs.build.result }}
          R_CLEANUP: ${{ needs.cleanup_release_branch.result }}
          R_PUBLISH_JOB: ${{ needs.publish_to_npm.result }}
          ERR_TEXT: ${{ steps.publish_err_excerpt.outputs.text }}
        run: |
          set -euo pipefail
          ic() {
            case "${1:-}" in
              success) printf '%s' '✅' ;;
              skipped) printf '%s' '⏭️' ;;
              cancelled) printf '%s' '🛑' ;;
              *) printf '%s' '❌' ;;
            esac
          }
          DELIM="DISCORD_EMBED_BODY_EOF"
          {
            echo "description<<${DELIM}"
            printf '🚀 **Heimdall release** · `%s` · **%s**\n\n' "${REPOSITORY}" "${RELEASE_TAG}"
            printf '🔗 [**Open workflow run**](%s)\n\n' "${RUN_URL}"
            printf '**Stages**\n'
            printf '%s · Validate release tag · **%s**\n' "$(ic "$R_VALIDATE")" "${R_VALIDATE}"
            printf '%s · Sync version & push branch · **%s**\n' "$(ic "$R_PREPARE")" "${R_PREPARE}"
            printf '%s · Build package artifact · **%s**\n' "$(ic "$R_BUILD")" "${R_BUILD}"
            printf '%s · Delete release branch · **%s**\n' "$(ic "$R_CLEANUP")" "${R_CLEANUP}"
            printf '%s · Publish to npm · **%s**\n' "$(ic "$R_PUBLISH_JOB")" "${R_PUBLISH_JOB}"
            if [ -n "${ERR_TEXT:-}" ]; then
              printf '\n**npm output** *(truncated)*\n```text\n%s\n```\n' "${ERR_TEXT}"
            else
              printf '\n_No npm stderr captured._\n'
            fi
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Post release outcome to Discord
        continue-on-error: true
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: Heimdall CI
          embed-title: ${{ format('{0} · {1}', steps.discord_meta.outputs.title_prefix, github.event.release.tag_name) }}
          embed-description: ${{ steps.discord_embed.outputs.description }}
          embed-color: ${{ steps.discord_meta.outputs.color }}
          embed-footer-text: ${{ github.repository }}
