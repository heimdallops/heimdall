name: Discord notify

on:
  workflow_call:
    inputs:
      title:
        description: Embed title
        type: string
        required: true
      description:
        description: Embed description (Discord markdown supported)
        type: string
        required: true
      tone:
        description: success (green), failure (red), or info (blue)
        type: string
        required: false
        default: info
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  notify:
    name: Post to Discord
    runs-on: ubuntu-latest
    steps:
      - id: webhook
        name: Check Discord webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          URL="$(printf '%s' "${DISCORD_WEBHOOK_URL:-}" | tr -d '[:space:]')"
          if [ -z "$URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Discord skipped::DISCORD_WEBHOOK_URL is not set; no message was sent to Discord."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord webhook
        if: steps.webhook.outputs.configured == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TITLE: ${{ inputs.title }}
          DESCRIPTION: ${{ inputs.description }}
          TONE: ${{ inputs.tone }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          webhook = (os.environ.get("WEBHOOK_URL") or "").strip().rstrip("/")
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK_URL was empty after gate step")
          webhook = webhook.replace("https://discordapp.com/", "https://discord.com/")

          colors = {"success": 3066993, "failure": 15158332, "info": 3447003}
          tone = (os.environ.get("TONE") or "info").lower()
          color = colors.get(tone, colors["info"])

          payload = {
              "embeds": [
                  {
                      "title": os.environ["TITLE"],
                      "description": os.environ["DESCRIPTION"],
                      "color": color,
                      "footer": {"text": os.environ.get("REPO", "")},
                  }
              ]
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Heimdall-CI/1.0 (GitHub Actions)",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  if resp.status not in (200, 204):
                      raise SystemExit(f"Discord webhook returned HTTP {resp.status}")
          except urllib.error.HTTPError as e:
              detail = ""
              try:
                  detail = e.read().decode("utf-8", errors="replace")
              except Exception:
                  pass
              if detail:
                  print(f"Discord response body: {detail}")
              raise SystemExit(
                  f"Discord webhook HTTP error: {e.code} {e.reason}"
              ) from e
          PY
