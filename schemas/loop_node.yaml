$schema: 'https://json-schema.org/draft/2020-12/schema'
description: Runs a series of nodes repeatedly until a condition is met or a maximum iteration count is reached.
allOf:
  - $ref: node.yaml
  - type: object
    properties:
      loop:
        type: object
        description: Run a series of nodes in a loop until a condition is met.
        properties:
          until:
            type: string
            description: >-
              CEL expression that exits the loop when it evaluates to true.
              Evaluated after each iteration (a post-condition, like a
              do-while loop), so the loop body always runs at least once.
              Mutually exclusive with while. Do not wrap in ${{ }}. Within the
              expression, scope.loop.iteration and scope.loop.nodes.<id> (this
              loop's body results) are available, and needs.<id> /
              scope.needs.<id> refer to this loop node's own depends_on outputs.
              Use "true" combined with a break_node inside the loop to control
              exit explicitly from within the iteration.
          while:
            type: string
            description: >-
              CEL expression that continues the loop while it evaluates to true.
              Evaluated before each iteration (a pre-condition, like a while
              loop), so the loop body may run zero times if it is false up front.
              Mutually exclusive with until. Do not wrap in ${{ }}. Within the
              expression, scope.loop.iteration and scope.loop.nodes.<id> (the
              previous iteration's body results, empty on the first iteration)
              are available, and needs.<id> / scope.needs.<id> refer to this
              loop node's own depends_on outputs.
          max_iterations:
            type: integer
            description: >-
              Max number of iterations before the loop exits, regardless of
              until or while. Caps the loop even when until never evaluates to
              true, when while never evaluates to false, or when neither is set.
            minimum: 1
          nodes:
            type: array
            description: List of nodes to run on each iteration of the loop.
            items:
              $ref: node_union.yaml
            minItems: 1
          outputs:
            type: object
            description: >-
              Declares the values exposed to downstream nodes after the loop exits.
              Each key becomes a field on needs.<loop_id>.output. Values are CEL
              expressions evaluated in the loop's final iteration context, where
              scope.loop.iteration and scope.loop.nodes.<id> (this loop's body
              results) are available, and needs.<id> / scope.needs.<id> refer to
              this loop node's own depends_on outputs. Guard a node that may not
              have run (e.g. a conditional `if` node) with has(), such as
              "has(scope.loop.nodes.<id>) ? scope.loop.nodes.<id>.output :
              <default>". On an early break exit, scope.loop.nodes contains only
              the nodes that completed before the break fired; others are absent.
            additionalProperties:
              type: string
        required:
          - nodes
        anyOf:
          - required:
              - until
          - required:
              - while
          - required:
              - max_iterations
        not:
          required:
            - until
            - while
    required:
      - loop
