$schema: 'https://json-schema.org/draft/2020-12/schema'
allOf:
  - $ref: node.yaml
  - type: object
    properties:
      loop:
        type: object
        description: Run a series of nodes in a loop until a condition is met.
        properties:
          until:
            type: string
            description: Conditional expression that must evaluate to a truthy value to exit the loop.
          max_iterations:
            type: integer
            description: Max number of iterations before the loop exits even if until does not evaluate to a truthy value.
            minimum: 1
          nodes:
            type: array
            description: List of nodes to run on each iteration of the loop.
            items:
              $ref: node_union.yaml
            minItems: 1
        anyOf:
          - required:
              - until
          - required:
              - max_iterations
    required:
      - loop
