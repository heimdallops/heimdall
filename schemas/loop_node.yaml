$schema: 'https://json-schema.org/draft/2020-12/schema'
description: Runs a series of nodes repeatedly until a condition is met or a maximum iteration count is reached.
allOf:
  - $ref: node.yaml
  - type: object
    properties:
      loop:
        type: object
        description: Run a series of nodes in a loop until a condition is met.
        properties:
          until:
            type: string
            description: >-
              CEL expression that must evaluate to true to exit the loop.
              Do not wrap in ${{ }}. Use "true" combined with a break_node
              inside the loop to control exit explicitly from within the
              iteration.
          max_iterations:
            type: integer
            description: Max number of iterations before the loop exits even if until does not evaluate to a truthy value.
            minimum: 1
          nodes:
            type: array
            description: List of nodes to run on each iteration of the loop.
            items:
              $ref: node_union.yaml
            minItems: 1
          outputs:
            type: object
            description: >-
              Declares the values exposed to downstream nodes after the loop exits.
              Each key becomes a field on needs.<loop_id>.output. Values are CEL
              expressions evaluated in the loop's final iteration context, where
              scope.nodes.<id> and scope.iteration are available.
            additionalProperties:
              type: string
        required:
          - nodes
        anyOf:
          - required:
              - until
          - required:
              - max_iterations
    required:
      - loop
