$schema: 'https://json-schema.org/draft/2020-12/schema'
description: Base properties shared by all AI-executed node types (agent, prompt, prompt_file). Extends node.yaml.
allOf:
  - $ref: node.yaml
  - type: object
    properties:
      platform:
        $ref: platform.yaml
      platform_options:
        $ref: platform_options_union.yaml
      session:
        type: string
        description: >-
          Session to continue from, normally another agentic node's
          `self.needs.<id>.session_id`. Supports `${{ }}` expressions. The node
          runs in a fork of that session: it starts with the session's conversation
          and produces its own `session_id`, leaving the original unchanged, so
          several nodes may continue from the same session. Absent or empty starts
          a fresh session with no memory of prior agent interactions.
      output_format:
        type: object
        description: >-
          JSON Schema object defining the structure for this node's output.
          Must be a valid JSON Schema. The model is asked to return data matching
          it, and the node's output is that structured object; the node fails if
          the model completes without producing it.
