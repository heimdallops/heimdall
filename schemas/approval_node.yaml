$schema: 'https://json-schema.org/draft/2020-12/schema'
description: Pauses the workflow and prompts the user for approval before continuing.
allOf:
  - $ref: node.yaml
  - type: object
    properties:
      approval:
        type: object
        title: Human approval gate
        description: >-
          Requests approval before continuing. A downstream node that declares this one reads the
          result as `self.needs.<id>.output` — see `schemas/expression_context.yaml`.
        properties:
          message:
            type: string
            description: >-
              Message to display to the user. Supports ${{ <expression> }}
              interpolation using CEL expressions.
          exit_on_no:
            type: boolean
            default: false
            description: >-
              When true, a "no" response immediately exits the workflow. When false (default),
              the workflow continues and downstream nodes can route on
              `self.needs.<id>.output.approved`.
          enable_feedback:
            type: boolean
            default: false
            description: Enable a third option to gather user feedback.
        required:
          - message
    required:
      - approval
