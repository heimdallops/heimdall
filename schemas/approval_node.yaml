$schema: 'https://json-schema.org/draft/2020-12/schema'
description: Pauses the workflow and prompts the user for approval before continuing.
allOf:
  - $ref: node.yaml
  - type: object
    properties:
      approval:
        type: object
        description: >-
          Request human approval before continuing. The result is available to
          downstream nodes at the top level of self.needs.<id> — an approval
          result has no "output" wrapper, unlike every other node type. Use
          exit_on_no: true to exit the workflow when the user declines.
        properties:
          message:
            type: string
            description: >-
              Message to display to the user. Supports ${{ <expression> }}
              interpolation using CEL expressions.
          exit_on_no:
            type: boolean
            default: false
            description: >-
              When true, a "no" response exits the workflow — except when
              enable_feedback is true and the user supplied feedback, which
              completes the node instead so the feedback can be acted on, and
              the run continues. When false (default), the workflow always
              continues and downstream nodes route on self.needs.<id>.approved.
          enable_feedback:
            type: boolean
            default: false
            description: Enable a third option to gather user feedback.
        required:
          - message
    required:
      - approval
