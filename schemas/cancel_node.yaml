$schema: 'https://json-schema.org/draft/2020-12/schema'
description: Immediately cancels the workflow with a reason. Any in-flight parallel nodes are stopped.
allOf:
  - $ref: node.yaml
  - type: object
    properties:
      cancel:
        type: string
        description: The reason the workflow was cancelled. In-flight parallel nodes are stopped immediately.
    required:
      - cancel
