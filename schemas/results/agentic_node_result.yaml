$schema: 'https://json-schema.org/draft/2020-12/schema'
description: >-
  Output produced by any agentic node (agent_node, prompt_node, prompt_file_node). A downstream
  node that declares this one reads it as `self.needs.<id>.output` — see
  `schemas/expression_context.yaml`.
type: object
properties:
  output:
    title: The agent's final response
    description: >-
      A plain string when no output_format is defined. A structured object matching the
      output_format schema when one is, with fields reachable as
      `self.needs.<id>.output.<field>`.
    oneOf:
      - type: string
      - type: object
required:
  - output
