$schema: 'https://json-schema.org/draft/2020-12/schema'
description: >-
  Output produced by any agentic node (agent_node, prompt_node, prompt_file_node). Available
  to downstream nodes via self.needs.<id>.output, always as an unparsed string. The engine
  does not parse agent output, so its fields cannot be addressed directly; to branch on a
  structured answer, pass the string through a bash_node with output_format: json.
type: object
properties:
  output:
    type: string
    description: The agent's final response, as a string.
required:
  - output
