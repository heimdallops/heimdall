$schema: 'https://json-schema.org/draft/2020-12/schema'
description: >-
  Output of a loop_node. Accessible to downstream nodes via
  self.needs.<id>.<property>.
type: object
properties:
  iterations:
    type: integer
    description: >-
      Number of fully-completed iterations when the loop exited. A loop that
      completed one iteration has iterations: 1; a loop whose body hit a
      break_node before completing any iteration has iterations: 0.
      Accessible to downstream nodes via self.needs.<loop_id>.iterations.
    minimum: 0
  output:
    type: object
    description: >-
      The resolved outputs declared in the loop's outputs map. Each key is a
      name declared under outputs and its value is the result of evaluating the
      corresponding CEL expression at the end of the final iteration.
      Accessible to downstream nodes via self.needs.<loop_id>.output.<key>.
    additionalProperties: true
required:
  - iterations
  - output
