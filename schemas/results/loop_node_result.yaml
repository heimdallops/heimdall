$schema: 'https://json-schema.org/draft/2020-12/schema'
description: >-
  Output of a loop_node. Accessible to downstream nodes via
  self.needs.<id>.<property>.
type: object
properties:
  iterations:
    type: integer
    description: >-
      Number of body executions that terminated before the loop exited. A loop
      that ran its body once has iterations: 1. An execution cut short by a
      break_node still counts, so a loop whose first body execution breaks
      immediately also reports iterations: 1, not 0.
      Accessible to downstream nodes via self.needs.<loop_id>.iterations.
    minimum: 0
  output:
    type: object
    description: >-
      The resolved outputs declared in the loop's outputs map. Each key is a
      name declared under outputs and its value is the result of evaluating the
      corresponding CEL expression at the end of the final iteration.
      Accessible to downstream nodes via self.needs.<loop_id>.output.<key>.
    additionalProperties: true
required:
  - iterations
  - output
