$schema: 'https://json-schema.org/draft/2020-12/schema'
description: >-
  Output produced by a bash_node. A downstream node that declares this one reads it as
  `self.needs.<id>.output` — see `schemas/expression_context.yaml`. The source is the contents of
  the HEIMDALL_OUTPUT file injected by the engine.
type: object
properties:
  output:
    title: Contents of HEIMDALL_OUTPUT, with trailing newlines stripped
    description: |-
      - `output_format: text` (default) — a plain string, empty when nothing was written.
      - `output_format: json` — any valid JSON value (object, array, number, boolean or null),
        null when nothing was written. The node fails immediately if the contents are not valid
        JSON.
required:
  - output
