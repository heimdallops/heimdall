$schema: 'https://json-schema.org/draft/2020-12/schema'
description: >-
  Result of an approval_node. Its properties sit at the top level of
  self.needs.<id> — as self.needs.<id>.approved, not under an "output" key,
  unlike every other node type. When exit_on_no is true, a declining response
  exits the workflow and produces no result, unless enable_feedback is true
  and the user supplied feedback, in which case the node completes with
  approved false and the run continues.
type: object
properties:
  approved:
    type: boolean
    description: True if the user approved, false if they declined.
  feedback:
    type: string
    description: >-
      The user's feedback string. Only present when enable_feedback is true
      and the user chose to provide feedback rather than approving or declining.
required:
  - approved
