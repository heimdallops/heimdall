$schema: 'https://json-schema.org/draft/2020-12/schema'
description: >-
  Immediately ends the scoped node whose body directly contains it — see
  `schemas/expression_context.yaml`. Any in-flight parallel nodes in that body are stopped. Not
  valid at the top level of a workflow. In a loop, the interrupted iteration counts as finished:
  it increments the loop's `iterations`, and the loop exits.

  Combined with `if:`, the condition acts as a guard: when it is true the break fires; when it
  is false the node is skipped. A skipped break produces no output, so it does not cascade its
  skip to dependents — nodes that `depends_on` it still run.
allOf:
  - $ref: node.yaml
  - type: object
    properties:
      break:
        description: >-
          Ends the scoped node whose body directly contains this node. The value is
          ignored; only the presence of this field matters.
    required:
      - break
