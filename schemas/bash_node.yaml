$schema: 'https://json-schema.org/draft/2020-12/schema'
description: |-
  Executes a bash script. A downstream node that declares this one reads the result as
  `self.needs.<id>.output` — see `schemas/expression_context.yaml`.

  The engine injects a `HEIMDALL_OUTPUT` environment variable holding the path to a temporary
  file. Write to that file to control exactly what is exposed as output: only its contents are
  read, so incidental stdout from commands like `apt` or `curl` does not contaminate the result.
  If nothing is written, the output is empty.
allOf:
  - $ref: node.yaml
  - type: object
    properties:
      bash:
        type: string
        description: >-
          The bash script to execute. Supports ${{ <expression> }} interpolation
          using CEL expressions.
      env:
        type: object
        description: Key/value pairs to inject into the environment.
        additionalProperties:
          type: string
          description: >-
            Environment variable value. Supports ${{ <expression> }}
            interpolation using CEL expressions.
      output_format:
        type: string
        enum:
          - text
          - json
        default: text
        title: How the contents of HEIMDALL_OUTPUT are parsed
        description: |-
          - `text` (default) — the contents become a plain string.
          - `json` — the contents are parsed as JSON, so fields are reachable as
            `self.needs.<id>.output.<field>`. The node fails immediately if the contents are not
            valid JSON.
    required:
      - bash
