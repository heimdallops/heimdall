$schema: 'https://json-schema.org/draft/2020-12/schema'
description: Executes a bash script and exposes its stdout as the node output.
allOf:
  - $ref: node.yaml
  - type: object
    properties:
      bash:
        type: string
        description: >-
          The bash script to execute. Supports ${{ <expression> }} interpolation
          using CEL expressions.
      env:
        type: object
        description: Key/value pairs to inject into the environment.
        additionalProperties:
          type: string
          description: >-
            Environment variable value. Supports ${{ <expression> }}
            interpolation using CEL expressions.
      output_format:
        type: string
        enum:
          - text
          - json
        default: text
        description: >-
          Controls how stdout is parsed. "text" (default) exposes stdout as a
          plain string on needs.<id>.output. "json" parses stdout as JSON and
          exposes the parsed structure on needs.<id>.output, making fields
          accessible as needs.<id>.output.<field>. If "json" is set and stdout
          is not valid JSON, the node fails immediately.
    required:
      - bash
