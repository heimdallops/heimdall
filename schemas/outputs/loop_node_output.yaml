$schema: 'https://json-schema.org/draft/2020-12/schema'
description: >-
  Output of a loop_node. Accessible to downstream nodes via needs.<id>.<property>
  and to nodes within the loop via loop.<property>, where loop refers to the
  enclosing loop_node's own output context.
type: object
properties:
  iteration:
    type: integer
    description: >-
      Number of iterations completed so far. 0 during the first iteration,
      incremented to 1 once it completes, 2 after the second, and so on.
      Use loop.iteration inside the loop and needs.<loop_id>.iteration outside.
    minimum: 0
  nodes:
    type: object
    description: >-
      Output of each child node keyed by node id, always reflecting that node's
      most recent execution. Within a loop, if a node has not yet run in the
      current iteration, loop.nodes.<id> holds its output from the previous
      iteration; on the first iteration it is undefined.

      Prefer needs.<id> over loop.nodes.<id> when referencing a direct
      predecessor — needs makes execution order explicit and prevents potential
      race conditions. Use loop.nodes.<id> only when you need the output of a
      node that runs after the current node in the iteration order.

      After the loop exits, accessible to downstream nodes via
      needs.<loop_id>.nodes.<id>.
    additionalProperties:
      description: The output of the child node with the matching id.
required:
  - iteration
  - nodes
