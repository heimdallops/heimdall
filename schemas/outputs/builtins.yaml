$schema: 'https://json-schema.org/draft/2020-12/schema'
description: >-
  Built-in keywords available in expression contexts throughout a workflow.
type: object
properties:
  loop:
    description: >-
      Keyword available only within a loop_node's nodes list. Refers to the
      enclosing loop_node's live output context (see loop_node_output.yaml).
      Use loop.iteration for the number of iterations completed so far.
      Use loop.nodes.<id> to access a sibling node's output from the previous
      iteration — undefined on the first iteration.
      Cannot be used outside a loop — use needs.<loop_id> instead.
    $ref: loop_node_output.yaml
  heimdall:
    type: object
    description: Workflow-scoped runtime variables provided by Heimdall.
    properties:
      session_dir:
        type: string
        description: >-
          Absolute path to a temporary directory scoped to this workflow run.
          Persists for the lifetime of the run. Use it to share files between
          nodes (e.g. spec.md, progress.txt) without polluting the workspace.
    required:
      - session_dir
