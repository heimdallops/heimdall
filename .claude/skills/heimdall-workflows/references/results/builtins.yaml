# heimdall-generated: v0.1.0 — installed by `heimdall skills install`. Edits are overwritten.
$schema: 'https://json-schema.org/draft/2020-12/schema'
description: >-
  Built-in keywords available in expression contexts throughout a workflow. The
  namespace is closed at these five roots at every expression site: inputs,
  vars, heimdall, self, and scopes. Nothing else is bound — a bare node id, or a
  bare needs/nodes/iteration, does not resolve.
type: object
properties:
  inputs:
    type: object
    description: >-
      Resolved values of the workflow's declared inputs. Each key corresponds
      to an input name declared in the top-level inputs map; the value is the
      resolved runtime value (after applying defaults). The shape of each value
      matches the declared type (string, number, integer, or boolean).
    additionalProperties:
      oneOf:
        - type: string
        - type: number
        - type: integer
        - type: boolean
  vars:
    type: object
    description: >-
      Resolved values of the workflow's declared variables. Each key corresponds
      to a variable name declared in the top-level variables map; the value is
      the resolved runtime value (string, number, integer, or boolean).
    additionalProperties:
      oneOf:
        - type: string
        - type: number
        - type: integer
        - type: boolean
  heimdall:
    type: object
    description: >-
      Workflow-scoped runtime values provided by Heimdall. Identical at every
      scope depth.
    properties:
      session_dir:
        type: string
        description: >-
          Absolute path to a temporary directory scoped to this workflow run.
          Persists for the lifetime of the run. Use it to share files between
          nodes (e.g. spec.md, progress.txt) without polluting the workspace.
      run_cwd:
        type: string
        description: >-
          Absolute path to the directory the run started in. Constant for the
          whole run and unaffected by enclosing worktrees. Use it from inside
          a worktree body to reach paths outside that worktree (e.g. to anchor
          a dir override).
    required:
      - session_dir
      - run_cwd
  self:
    type: object
    description: >-
      What the evaluating node knows about itself right now. Its contents depend
      on the phase the expression runs in, because the phase decides what has
      happened by then. At an entry site — a node's own if, and the ${{ }}
      interpolation of its own fields — only needs is bound, because the node
      has produced nothing yet. At a loop checkpoint — that loop's while, until,
      and outputs — nodes and iterations are bound as well.
    properties:
      needs:
        type: object
        description: >-
          Results of the nodes this node declared in depends_on, keyed by node
          id. Narrowed to declared edges: a node that ran but was not declared
          is absent, and so is a declared dependency that was skipped. Guard a
          conditional dependency with has().
        additionalProperties:
          description: The result of the dependency node with the matching id.
      nodes:
        type: object
        description: >-
          Results of this loop's own body nodes from the latest body execution,
          keyed by node id. Never merged across executions. Empty at a while
          checkpoint before the first execution. On an early break, holds only
          the nodes that completed before the break fired, so guard with has().
          Bound only at a loop checkpoint; an entry site sees only self.needs.
        additionalProperties:
          description: The result of the body node with the matching id.
      iterations:
        type: integer
        description: >-
          Number of body executions that have terminated when this checkpoint
          is evaluated: 0 at the while check before the first execution, 1 at
          the checkpoints following the first, and so on. Bound only at a loop
          checkpoint — a checkpoint has no index, just as a body node has no
          iterations.
        minimum: 0
  scopes:
    type: object
    description: >-
      The enclosing scoped nodes, keyed by the scope-opening node's own id. Flat
      rather than chained — node ids are unique across the whole workflow, so
      scopes.<id> names one ancestor unambiguously however deep the nesting, and
      wrapping a node list in a new enclosing loop leaves every existing
      reference in it valid. A scope-opening node never appears in its own
      scopes map; it is visible to the nodes inside it.
    additionalProperties:
      type: object
      description: One enclosing scope, keyed by the id of the node that opened it.
      properties:
        needs:
          type: object
          description: >-
            Results of the scope-opening node's own depends_on, keyed by node
            id. Nodes inside a loop body cannot declare depends_on against nodes
            outside it; declare the dependency on the loop node itself and read
            it here as scopes.<loop_id>.needs.<id>.
          additionalProperties:
            description: The result of the dependency node with the matching id.
        index:
          type: integer
          description: >-
            Zero-based index of the body execution currently running in that
            enclosing loop — 0 throughout the first, 1 throughout the second.
            Present on loop scopes only, and readable only from inside the body:
            a body node has an index, not iterations.
          minimum: 0
        prev:
          type: object
          description: >-
            Results of that loop's body nodes from the previous execution, keyed
            by node id. Empty during the first execution, so guard with has().
            Present on loop scopes only.
          additionalProperties:
            description: The result of the body node with the matching id.
      required:
        - needs
