# heimdall-generated: v0.1.0 — installed by `heimdall skills install`. Edits are overwritten.
$schema: 'https://json-schema.org/draft/2020-12/schema'
description: Runs a series of nodes repeatedly until a condition is met or a maximum iteration count is reached.
allOf:
  - $ref: node.yaml
  - type: object
    properties:
      loop:
        type: object
        description: Run a series of nodes in a loop until a condition is met.
        properties:
          until:
            type: string
            description: >-
              CEL expression that exits the loop when it evaluates to true.
              Evaluated after each iteration (a post-condition, like a
              do-while loop), so the loop body always runs at least once.
              Mutually exclusive with while. Do not wrap in ${{ }}. This is a
              loop checkpoint, so self.iterations (executions terminated so far)
              and self.nodes.<id> (the latest body execution's results) are
              available, and self.needs.<id> refers to this loop node's own
              depends_on outputs. A checkpoint sits outside its own scope:
              scopes.<this_loop_id> is not bound, though an enclosing loop's
              scopes.<outer_id> is. Use "true" combined with a break_node inside
              the loop to control exit explicitly from within the iteration.
          while:
            type: string
            description: >-
              CEL expression that continues the loop while it evaluates to true.
              Evaluated before each iteration (a pre-condition, like a while
              loop), so the loop body may run zero times if it is false up front.
              Mutually exclusive with until. Do not wrap in ${{ }}. This is a
              loop checkpoint, so self.iterations (executions terminated so far,
              0 on the first check) and self.nodes.<id> (the previous body
              execution's results, empty on the first check) are available, and
              self.needs.<id> refers to this loop node's own depends_on outputs.
              A checkpoint sits outside its own scope: scopes.<this_loop_id> is
              not bound, though an enclosing loop's scopes.<outer_id> is.
          max_iterations:
            type: integer
            description: >-
              Max number of iterations before the loop exits, regardless of
              until or while. Caps the loop even when until never evaluates to
              true, when while never evaluates to false, or when neither is set.
            minimum: 1
          nodes:
            type: array
            description: >-
              List of nodes to run on each iteration of the loop. Inside the
              body, this loop is readable as scopes.<loop_id>: .index is the
              zero-based index of the running execution, .needs.<id> the loop
              node's own depends_on outputs, and .prev.<id> the previous
              execution's body results (empty on the first, so guard with
              has()). Body nodes cannot declare depends_on against nodes outside
              the loop; declare that dependency on the loop node itself and read
              it through scopes.<loop_id>.needs.<id>.
            items:
              $ref: node_union.yaml
            minItems: 1
          outputs:
            type: object
            description: >-
              Declares the values exposed to downstream nodes after the loop exits.
              Each key becomes a field on self.needs.<loop_id>.output. Values are
              CEL expressions evaluated at the loop's final checkpoint, where
              self.iterations (the total number of terminated executions) and
              self.nodes.<id> (the final body execution's results) are
              available, and self.needs.<id> refers to this loop node's own
              depends_on outputs. Guard a node that may not have run (e.g. a
              conditional `if` node) with has(), such as
              "has(self.nodes.<id>) ? self.nodes.<id>.output : <default>". On an
              early break exit, self.nodes contains only the nodes that
              completed before the break fired; others are absent.
            additionalProperties:
              type: string
        required:
          - nodes
        anyOf:
          - required:
              - until
          - required:
              - while
          - required:
              - max_iterations
        not:
          required:
            - until
            - while
    required:
      - loop
