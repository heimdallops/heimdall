baseURL = "/"
languageCode = "en-us"
title = "Heimdall"
enableEmoji = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.140.0"
  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
    disable = false
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false

[markup]
  [markup.tableOfContents]
    endLevel = 3
    startLevel = 1
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  google_fonts = [
    ["Inter", "300, 400, 600, 700"],
    ["JetBrains Mono", "400, 500, 700"],
  ]
  sans_serif_font = "Inter"
  secondary_font = "Inter"
  mono_font = "JetBrains Mono"

  [params.footer]
    copyright = "© :YEAR: [Heimdall](https://github.com/heimdallops/heimdall). MIT Licensed."

  [params.social]
    github = "heimdallops/heimdall"

  [params.docs]
    title = "Heimdall"
    themeColor = "cyan"
    darkMode = true
    prism = true
    prismTheme = "lucario"
    repoURL = "https://github.com/heimdallops/heimdall"
    repoBranch = "main"
    sidebarIcons = true
    titleIcon = true
    breadcrumbs = true
  [params.flexsearch]
    enabled = true

[menu]
  [[menu.primary]]
    name = "Docs"
    url = "docs/"
    identifier = "docs"
    weight = 10
  [[menu.primary]]
    name = "GitHub"
    url = "https://github.com/heimdallops/heimdall"
    identifier = "github"
    weight = 20
